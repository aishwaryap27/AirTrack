services:
  mongo:
    image: mongo:7.0
    container_name: airtrack-mongo
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - airtrack-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airtrack-backend
    restart: unless-stopped
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-AirTrafficDB}
      - DEBUG=${DEBUG:-False}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - API_PREFIX=${API_PREFIX:-/api}
    volumes:
      - ./data:/app/data
    networks:
      - airtrack-net
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).getcode() == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airtrack-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    networks:
      - airtrack-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
    name: airtrack_mongodb_data

networks:
  airtrack-net:
    name: airtrack-network
    driver: bridge
